<!DOCTYPE html>
<!--
  =============================================
  じぶんの 自己紹介ページ テンプレート
  =============================================
  ★ つかい方
  1. この ファイルを ダブルクリックで ブラウザで 開く
  2. メモ帳（Windows） / テキストエディット（Mac） で 開いて 編集
  3. 保存（Ctrl+S / Cmd+S） したら、ブラウザを 更新（F5）
  ★ 編集するところには  ←★ここを変える のメモが ついています
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>わたしの ページ</title> <!--★ここを変える：ページのタイトル-->
</head>
<body style="background: #FFF8EE; font-family: sans-serif; padding: 0; margin: 0;">

  <!-- ===== ヘッダー（上の カラフルなところ）===== -->
  <div style="background: linear-gradient(135deg, #FF8C1A, #FCBD19);
              color: white; text-align: center; padding: 30px 20px;">

    <div style="font-size: 80px; line-height: 1;">
      😺                                            <!--★ここを変える：自分の絵文字-->
    </div>

    <h1 style="margin: 10px 0 4px;">
      なまえ の ページ                              <!--★ここを変える：ニックネーム-->
    </h1>

    <p style="font-size: 18px; margin: 0; opacity: .95;">
      こんにちは！よろしくね                          <!--★ここを変える：あいさつ-->
    </p>
  </div>

  <!-- ===== 本文（白いところ）===== -->
  <div style="max-width: 600px; margin: 30px auto; padding: 0 20px;">

    <!-- 好きなもの 3つ -->
    <h2 style="color: #FF8C1A;">わたしの すきなもの</h2>
    <ul style="font-size: 18px; line-height: 1.8;">
      <li>🎮 マインクラフト</li>                      <!--★ここを変える-->
      <li>🐈 ねこ</li>                                <!--★ここを変える-->
      <li>🍛 カレーライス</li>                        <!--★ここを変える-->
    </ul>

    <!-- しょうらいの ゆめ -->
    <h2 style="color: #FF8C1A; margin-top: 30px;">しょうらいの ゆめ</h2>
    <p style="font-size: 18px; background: white; padding: 16px;
              border-radius: 12px; border-left: 6px solid #FF8C1A;">
      ゲームクリエイター                              <!--★ここを変える-->
    </p>

    <!-- じぶんの ひとこと -->
    <h2 style="color: #FF8C1A; margin-top: 30px;">ひとこと</h2>
    <p style="font-size: 16px; line-height: 1.8;">
      きょう HTMLを ならって、はじめて Webページを 作りました！<br>
      これからも いろいろ ためしてみたいです。           <!--★ここを変える-->
    </p>

    <p style="text-align: center; color: #999; margin-top: 40px; font-size: 13px;">
      🌐 HTMLで 作りました
    </p>

  </div>
</body>
</html>

<!--
  =============================================
  ★ もっと カスタマイズしたい人 むけメモ
  =============================================

  ◆ 色を 変えたい
    「#FF8C1A」 と書いてある部分を、好きな色コードに 変える。
    かんたんな色：
      red（赤） / blue（青） / green（みどり）
      orange（オレンジ） / gold（ゴールド） / hotpink（ピンク）
      purple（むらさき） / skyblue（みずいろ）

  ◆ リストを 増やしたい
    <li>〜</li> の行を コピーして 増やす。

  ◆ 画像を のせたい
    1. 画像ファイルを この HTMLと 同じフォルダに 入れる
    2. 入れたい場所に  <img src="ファイル名.jpg" width="200">  と書く
    ※ 自分の顔・家・学校の写真は のせない！

  ◆ お友だちの ページに リンクしたい
    <a href="https://〜">お友だちのページ</a>

  ◆ こまったら？
    → 教室で わたした スライドを 見直す
    → ブラウザで F12（Macは Option+Cmd+I） で エラーを たしかめる
-->
