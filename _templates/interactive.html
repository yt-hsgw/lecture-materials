<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第<回>｜<タイトル></title>
<style>
  :root {
    --primary: #3A86FF;
    --secondary: #FFD166;
    --accent: #06D6A0;
    --warn: #EF476F;
    --dark: #24323D;
    --light: #F3F8FF;
    --panel: #FFFFFF;
    --muted: #66737F;
    --shadow: 0 4px 0 rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Hiragino Maru Gothic ProN', 'M PLUS Rounded 1c', 'Yu Gothic', sans-serif;
    color: var(--dark);
    background: var(--light);
    line-height: 1.7;
  }
  button, input, select, textarea { font: inherit; }
  .progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 6px;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
    z-index: 100;
    transition: width .15s;
  }
  .top-status {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 60;
    background: rgba(255,255,255,.94);
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    font-size: 14px;
  }
  .top-status b { color: var(--primary); }
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 48px 20px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
  }
  .hero-inner { max-width: 960px; }
  .label {
    display: inline-block;
    background: rgba(255,255,255,.24);
    padding: 8px 22px;
    border-radius: 999px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(44px, 8vw, 96px);
    line-height: 1.1;
    margin-bottom: 20px;
    text-shadow: 0 4px 12px rgba(0,0,0,.18);
  }
  .hero p { font-size: clamp(18px, 2.4vw, 24px); }
  .section {
    padding: 80px 24px;
    max-width: 1120px;
    margin: 0 auto;
  }
  .section-label {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 6px 18px;
    border-radius: 999px;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 14px;
  }
  h2 {
    font-size: clamp(32px, 5vw, 50px);
    color: var(--primary);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .lead { font-size: 18px; color: var(--muted); margin-bottom: 34px; }
  .grid { display: grid; gap: 18px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card {
    background: var(--panel);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .quiz {
    background: white;
    border-radius: 20px;
    padding: 26px;
    box-shadow: var(--shadow);
  }
  .choices { display: grid; gap: 10px; margin-top: 14px; }
  .choice {
    border: 3px solid #DDE4F2;
    background: white;
    border-radius: 14px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    color: var(--dark);
  }
  .choice.correct { background: #E9FFF8; border-color: var(--accent); }
  .choice.wrong { background: #FFF0F4; border-color: var(--warn); }
  .result { margin-top: 12px; font-weight: bold; min-height: 28px; }
  .result.ok { color: #048A67; }
  .result.ng { color: var(--warn); }
  footer { padding: 50px 20px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) {
    .top-status { left: 12px; right: 12px; text-align: center; }
    .section { padding: 64px 16px; }
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="top-status"><span>第<回></span> <b><タイトル></b></div>

<header class="hero" id="top">
  <div class="hero-inner">
    <div class="label"><対象者・コース名> ／ 第<回></div>
    <h1><タイトル></h1>
    <p><この教材で体験すること></p>
  </div>
</header>

<section class="section">
  <span class="section-label">1. <テーマ></span>
  <h2><見出し></h2>
  <p class="lead"><説明文></p>
  <div class="grid grid-3">
    <div class="card"><h3><項目1></h3><p><説明></p></div>
    <div class="card"><h3><項目2></h3><p><説明></p></div>
    <div class="card"><h3><項目3></h3><p><説明></p></div>
  </div>
</section>

<section class="section">
  <div class="quiz" data-answer="a">
    <h3>クイズ</h3>
    <p><問い></p>
    <div class="choices">
      <button class="choice" data-choice="a"><選択肢A></button>
      <button class="choice" data-choice="b"><選択肢B></button>
      <button class="choice" data-choice="c"><選択肢C></button>
    </div>
    <div class="result" aria-live="polite"></div>
  </div>
</section>

<section class="section">
  <span class="section-label">ハンズオン</span>
  <h2><体験タイトル></h2>
  <p class="lead"><体験内容の説明></p>
  <div class="card">
    <p><ここにインタラクションを実装する></p>
  </div>
</section>

<footer>第<回>｜<タイトル></footer>

<script>
  const progress = document.getElementById('progress');
  function updateProgress() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = (max <= 0 ? 0 : (window.scrollY / max) * 100) + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  updateProgress();

  document.querySelectorAll('.quiz').forEach((quiz) => {
    const answer = quiz.dataset.answer;
    const result = quiz.querySelector('.result');
    quiz.querySelectorAll('.choice').forEach((button) => {
      button.addEventListener('click', () => {
        quiz.querySelectorAll('.choice').forEach((item) => item.classList.remove('correct', 'wrong'));
        if (button.dataset.choice === answer) {
          button.classList.add('correct');
          result.textContent = 'せいかい！';
          result.className = 'result ok';
        } else {
          button.classList.add('wrong');
          result.textContent = 'もう一度考えてみよう。';
          result.className = 'result ng';
        }
      });
    });
  });
</script>
</body>
</html>
