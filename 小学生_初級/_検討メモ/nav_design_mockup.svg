<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Hiragino Maru Gothic ProN, sans-serif">
  <defs>
    <style>
      .frame { fill: #FFF8F0; stroke: #2A3D45; stroke-width: 2; rx: 16; }
      .browser-bar { fill: #2A3D45; }
      .label { font-size: 18px; font-weight: bold; fill: #2A3D45; }
      .sublabel { font-size: 12px; fill: #6C757D; }
      .page-title { font-size: 14px; fill: #2A3D45; font-weight: bold; }
      .body-line { fill: #C8D6DC; rx: 3; }
      .badge { fill: #4ECDC4; }
      .badge-active { fill: #FF6B6B; }
      .dot { fill: #B0BEC5; }
      .dot-active { fill: #FF6B6B; }
      .pill { fill: white; stroke: #4ECDC4; stroke-width: 2; rx: 14; }
      .pill-text { font-size: 11px; fill: #2A3D45; font-weight: bold; }
      .check { fill: #4ECDC4; font-weight: bold; font-size: 14px; }
      .cross { fill: #FF6B6B; font-weight: bold; font-size: 14px; }
      .pros { font-size: 11px; fill: #4ECDC4; font-weight: bold; }
      .cons { font-size: 11px; fill: #FF6B6B; font-weight: bold; }
    </style>
  </defs>

  <!-- title -->
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#2A3D45">スライドナビゲーションUI 比較モックアップ</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#6C757D">同じHTMLレッスンに、4つの案を当てはめた見え方</text>

  <!-- ============== A. Dots only (ユーザー案) ============== -->
  <g transform="translate(40,100)">
    <text x="0" y="0" class="label">A. ドットだけ（ユーザー案そのまま）</text>
    <rect x="0" y="14" width="300" height="380" class="frame"/>
    <rect x="0" y="14" width="300" height="32" fill="#FF6B6B" rx="16"/>
    <text x="14" y="36" font-size="13" fill="white" font-weight="bold">きょうのゴール</text>
    <!-- body lines -->
    <rect x="20" y="64" width="200" height="8" class="body-line"/>
    <rect x="20" y="80" width="240" height="8" class="body-line"/>
    <rect x="20" y="96" width="180" height="8" class="body-line"/>
    <!-- card -->
    <rect x="20" y="120" width="240" height="60" fill="white" rx="8"/>
    <rect x="34" y="138" width="160" height="8" class="body-line"/>
    <rect x="34" y="158" width="120" height="8" class="body-line"/>
    <rect x="20" y="200" width="240" height="60" fill="white" rx="8"/>
    <rect x="34" y="220" width="160" height="8" class="body-line"/>
    <!-- right dots -->
    <g>
      <circle cx="280" cy="80" r="5" class="dot"/>
      <circle cx="280" cy="105" r="5" class="dot"/>
      <circle cx="280" cy="130" r="7" class="dot-active"/>
      <circle cx="280" cy="155" r="5" class="dot"/>
      <circle cx="280" cy="180" r="5" class="dot"/>
      <circle cx="280" cy="205" r="5" class="dot"/>
      <circle cx="280" cy="230" r="5" class="dot"/>
    </g>
    <!-- evaluation -->
    <text x="0" y="430" class="pros">◎ シンプル・邪魔しない</text>
    <text x="0" y="450" class="cons">△ 何の章か分からない</text>
    <text x="0" y="468" class="cons">△ 遠目から狙いにくい</text>
  </g>

  <!-- ============== B. Numbered badges + hover label (推奨) ============== -->
  <g transform="translate(370,100)">
    <text x="0" y="0" class="label">B. 番号バッジ + ホバーで章名 ★ 推奨</text>
    <rect x="0" y="14" width="300" height="380" class="frame"/>
    <rect x="0" y="14" width="300" height="32" fill="#FF6B6B" rx="16"/>
    <text x="14" y="36" font-size="13" fill="white" font-weight="bold">きょうのゴール</text>
    <rect x="20" y="64" width="200" height="8" class="body-line"/>
    <rect x="20" y="80" width="240" height="8" class="body-line"/>
    <rect x="20" y="96" width="180" height="8" class="body-line"/>
    <rect x="20" y="120" width="240" height="60" fill="white" rx="8"/>
    <rect x="34" y="138" width="160" height="8" class="body-line"/>
    <rect x="34" y="158" width="120" height="8" class="body-line"/>
    <rect x="20" y="200" width="240" height="60" fill="white" rx="8"/>
    <rect x="34" y="220" width="160" height="8" class="body-line"/>
    <!-- numbered badges -->
    <g>
      <circle cx="278" cy="80" r="11" fill="#B0BEC5"/>
      <text x="278" y="84" text-anchor="middle" font-size="11" fill="white" font-weight="bold">1</text>
      <circle cx="278" cy="110" r="11" fill="#B0BEC5"/>
      <text x="278" y="114" text-anchor="middle" font-size="11" fill="white" font-weight="bold">2</text>
      <!-- active with label popping out -->
      <circle cx="278" cy="140" r="14" class="badge-active"/>
      <text x="278" y="145" text-anchor="middle" font-size="13" fill="white" font-weight="bold">3</text>
      <!-- hover label -->
      <rect x="170" y="128" width="100" height="24" class="pill"/>
      <text x="220" y="144" text-anchor="middle" class="pill-text">パソコンとは</text>
      <polygon points="270,140 264,134 264,146" fill="white" stroke="#4ECDC4" stroke-width="2"/>

      <circle cx="278" cy="170" r="11" fill="#B0BEC5"/>
      <text x="278" y="174" text-anchor="middle" font-size="11" fill="white" font-weight="bold">4</text>
      <circle cx="278" cy="200" r="11" fill="#B0BEC5"/>
      <text x="278" y="204" text-anchor="middle" font-size="11" fill="white" font-weight="bold">5</text>
      <circle cx="278" cy="230" r="11" fill="#B0BEC5"/>
      <text x="278" y="234" text-anchor="middle" font-size="11" fill="white" font-weight="bold">6</text>
    </g>
    <text x="0" y="430" class="pros">◎ 遠目でも判別できる</text>
    <text x="0" y="450" class="pros">◎ ホバーで章名が分かる</text>
    <text x="0" y="468" class="pros">◎ 現在地が大きく強調される</text>
  </g>

  <!-- ============== C. Top progress + chips ============== -->
  <g transform="translate(700,100)">
    <text x="0" y="0" class="label">C. 上部に章チップを並べる</text>
    <rect x="0" y="14" width="300" height="380" class="frame"/>
    <!-- chips bar -->
    <rect x="0" y="14" width="300" height="32" fill="white"/>
    <line x1="0" y1="46" x2="300" y2="46" stroke="#E0E0E0"/>
    <g font-size="9" fill="white" font-weight="bold">
      <rect x="6" y="22" width="38" height="16" fill="#B0BEC5" rx="8"/><text x="25" y="33" text-anchor="middle">1.PC</text>
      <rect x="48" y="22" width="38" height="16" fill="#B0BEC5" rx="8"/><text x="67" y="33" text-anchor="middle">2.中身</text>
      <rect x="90" y="22" width="46" height="16" fill="#FF6B6B" rx="8"/><text x="113" y="33" text-anchor="middle">3.ファイル</text>
      <rect x="140" y="22" width="46" height="16" fill="#B0BEC5" rx="8"/><text x="163" y="33" text-anchor="middle">4.ハンズ</text>
      <rect x="190" y="22" width="40" height="16" fill="#B0BEC5" rx="8"/><text x="210" y="33" text-anchor="middle">5.まと</text>
      <rect x="234" y="22" width="40" height="16" fill="#B0BEC5" rx="8"/><text x="254" y="33" text-anchor="middle">6.次へ</text>
    </g>
    <!-- title under chips -->
    <rect x="0" y="46" width="300" height="32" fill="#FF6B6B"/>
    <text x="14" y="68" font-size="13" fill="white" font-weight="bold">きょうのゴール</text>
    <rect x="20" y="96" width="200" height="8" class="body-line"/>
    <rect x="20" y="112" width="240" height="8" class="body-line"/>
    <rect x="20" y="128" width="180" height="8" class="body-line"/>
    <rect x="20" y="152" width="260" height="60" fill="white" rx="8"/>
    <rect x="34" y="170" width="160" height="8" class="body-line"/>
    <rect x="34" y="190" width="120" height="8" class="body-line"/>
    <rect x="20" y="232" width="260" height="60" fill="white" rx="8"/>
    <rect x="34" y="252" width="160" height="8" class="body-line"/>
    <text x="0" y="430" class="pros">◎ 章名が常に見える</text>
    <text x="0" y="450" class="cons">△ 章数が多いと窮屈</text>
    <text x="0" y="468" class="cons">△ 上の固定スペースを占める</text>
  </g>

  <!-- ============== D. FAB menu ============== -->
  <g transform="translate(1030,100)">
    <text x="0" y="0" class="label">D. 右下フローティングメニュー</text>
    <rect x="0" y="14" width="300" height="380" class="frame"/>
    <rect x="0" y="14" width="300" height="32" fill="#FF6B6B" rx="16"/>
    <text x="14" y="36" font-size="13" fill="white" font-weight="bold">きょうのゴール</text>
    <rect x="20" y="64" width="200" height="8" class="body-line"/>
    <rect x="20" y="80" width="240" height="8" class="body-line"/>
    <rect x="20" y="96" width="180" height="8" class="body-line"/>
    <rect x="20" y="120" width="240" height="60" fill="white" rx="8"/>
    <rect x="34" y="138" width="160" height="8" class="body-line"/>
    <rect x="34" y="158" width="120" height="8" class="body-line"/>
    <rect x="20" y="200" width="240" height="60" fill="white" rx="8"/>
    <rect x="34" y="220" width="160" height="8" class="body-line"/>
    <!-- expanded menu -->
    <rect x="160" y="270" width="125" height="110" fill="white" stroke="#4ECDC4" stroke-width="2" rx="12"/>
    <text x="172" y="290" font-size="10" font-weight="bold" fill="#4ECDC4">目次</text>
    <text x="172" y="306" font-size="10" fill="#2A3D45">1. パソコンとは</text>
    <text x="172" y="322" font-size="10" fill="#2A3D45">2. 中身</text>
    <text x="172" y="338" font-size="10" fill="#FF6B6B" font-weight="bold">3. ファイル ←今</text>
    <text x="172" y="354" font-size="10" fill="#2A3D45">4. ハンズオン</text>
    <text x="172" y="370" font-size="10" fill="#2A3D45">5. まとめ</text>
    <!-- FAB -->
    <circle cx="270" cy="370" r="20" fill="#4ECDC4"/>
    <text x="270" y="377" text-anchor="middle" fill="white" font-size="18" font-weight="bold">☰</text>
    <text x="0" y="430" class="pros">◎ 普段は完全に隠れる</text>
    <text x="0" y="450" class="cons">△ 1クリック余計に必要</text>
    <text x="0" y="468" class="cons">△ 開いてる間は本文を覆う</text>
  </g>

  <!-- ============== bottom row ============== -->
  <g transform="translate(40,600)">
    <text x="0" y="0" class="label">E. キーボードショートカット（不可視）</text>
    <rect x="0" y="14" width="640" height="240" class="frame"/>
    <!-- keyboard mockup -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="560" height="160" fill="#36454F" rx="12"/>
      <!-- rows of keys -->
      <g fill="#1A1A1A" stroke="#555">
        <rect x="20" y="20" width="40" height="34" rx="4"/>
        <rect x="65" y="20" width="40" height="34" rx="4"/>
        <rect x="110" y="20" width="40" height="34" rx="4"/>
        <rect x="155" y="20" width="40" height="34" rx="4"/>
        <rect x="200" y="20" width="40" height="34" rx="4"/>
        <rect x="245" y="20" width="40" height="34" rx="4"/>
        <rect x="290" y="20" width="40" height="34" rx="4"/>
        <rect x="335" y="20" width="40" height="34" rx="4"/>
        <rect x="380" y="20" width="40" height="34" rx="4"/>
      </g>
      <!-- highlighted: number keys 1-9 -->
      <g fill="#FFE66D" stroke="#FF6B6B" stroke-width="2">
        <rect x="20" y="20" width="40" height="34" rx="4"/>
        <rect x="65" y="20" width="40" height="34" rx="4"/>
        <rect x="110" y="20" width="40" height="34" rx="4"/>
        <rect x="155" y="20" width="40" height="34" rx="4"/>
        <rect x="200" y="20" width="40" height="34" rx="4"/>
        <rect x="245" y="20" width="40" height="34" rx="4"/>
      </g>
      <g font-size="14" font-weight="bold" fill="#2A3D45" text-anchor="middle">
        <text x="40" y="42">1</text><text x="85" y="42">2</text><text x="130" y="42">3</text>
        <text x="175" y="42">4</text><text x="220" y="42">5</text><text x="265" y="42">6</text>
      </g>
      <g font-size="11" fill="white" text-anchor="middle">
        <text x="310" y="42">7</text><text x="355" y="42">8</text><text x="400" y="42">9</text>
      </g>
      <!-- arrow keys -->
      <rect x="430" y="20" width="40" height="34" rx="4" fill="#4ECDC4" stroke="#FFE66D" stroke-width="2"/>
      <text x="450" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="white">←</text>
      <rect x="475" y="20" width="40" height="34" rx="4" fill="#4ECDC4" stroke="#FFE66D" stroke-width="2"/>
      <text x="495" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="white">→</text>
      <!-- spacebar -->
      <rect x="80" y="80" width="320" height="30" rx="6" fill="#4ECDC4" stroke="#FFE66D" stroke-width="2"/>
      <text x="240" y="100" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Space（次へ）</text>
      <!-- legend -->
      <text x="20" y="145" fill="white" font-size="12">1〜6 ＝ 章ジャンプ ／ ←→ ＝ 前後 ／ Space ＝ 次へ ／ ? ＝ ヘルプ</text>
    </g>
    <text x="0" y="285" class="pros">◎ 完全に不可視・デザインを一切壊さない</text>
    <text x="0" y="305" class="pros">◎ 講師がノートPCで瞬時に操作できる</text>
    <text x="0" y="325" class="cons">△ 子どもや初見の人には伝わらない（→ ?キーでヘルプ）</text>
  </g>

  <!-- recommendation summary -->
  <g transform="translate(720,600)">
    <text x="0" y="0" class="label" fill="#FF6B6B">★ 最終おすすめ：B + E + アイコン</text>
    <rect x="0" y="14" width="640" height="280" fill="#FFF3E0" stroke="#FF6B6B" stroke-width="2" rx="16"/>
    <g transform="translate(20,40)">
      <circle cx="20" cy="14" r="14" fill="#FF6B6B"/>
      <text x="20" y="19" text-anchor="middle" fill="white" font-weight="bold" font-size="14">3</text>
      <text x="50" y="20" font-size="14" font-weight="bold" fill="#2A3D45">右側 縦並びの番号バッジ（B）</text>
      <text x="50" y="40" font-size="11" fill="#6C757D">章番号で遠目でも判別／クリックで該当章へジャンプ</text>
    </g>
    <g transform="translate(20,90)">
      <rect x="0" y="0" width="40" height="28" fill="white" stroke="#4ECDC4" stroke-width="2" rx="14"/>
      <text x="20" y="19" text-anchor="middle" font-size="11" font-weight="bold" fill="#4ECDC4">パソコンとは</text>
      <text x="60" y="20" font-size="14" font-weight="bold" fill="#2A3D45">ホバー／タップで章タイトル（A）</text>
      <text x="60" y="40" font-size="11" fill="#6C757D">普段は控えめ、必要なときだけ章名がチラッと出る</text>
    </g>
    <g transform="translate(20,140)">
      <rect x="0" y="0" width="32" height="28" fill="#4ECDC4" rx="4"/>
      <text x="16" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="white">→</text>
      <text x="50" y="20" font-size="14" font-weight="bold" fill="#2A3D45">キーボードショートカット（E）</text>
      <text x="50" y="40" font-size="11" fill="#6C757D">←→で前後 ／ 1〜6で直行 ／ ?でヘルプ</text>
    </g>
    <g transform="translate(20,190)">
      <text x="20" y="20" text-anchor="middle" font-size="20">🖥️</text>
      <text x="50" y="20" font-size="14" font-weight="bold" fill="#2A3D45">バッジ内に章ミニアイコン</text>
      <text x="50" y="40" font-size="11" fill="#6C757D">数字＋アイコンで「あ、ここはハンズオンだ」が一目でわかる</text>
    </g>
    <g transform="translate(20,240)">
      <text x="0" y="0" font-size="11" fill="#FF6B6B" font-weight="bold">▼ 実装したくなったらこの方向で進めればOK</text>
    </g>
  </g>
</svg>
